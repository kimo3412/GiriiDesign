server:
  port: 8081

spring:
  application:
    name: design-studio
  # ==================== 数据库配置 ====================
  datasource:
    url: jdbc:mysql://localhost:3306/design_studio?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
  # ==================== Jackson 配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  # ==================== 文件上传 ====================
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  security:
    user:
      name: admin
      password: admin123

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.designstudio.**.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== JWT 配置 ====================
jwt:
  secret: YourDesignStudioJwtSecretKeyMustBeLongEnoughForHS256Algorithm2026
  expiration: 604800000  # 7 天 (毫秒)

# ==================== 微信小程序配置 ====================
wechat:
  miniapp:
    appid: "wx5aeef2c8fab8bc4d"
    secret: "your_real_app_secret_here" # TODO: 请替换为你的真实 AppSecret

# ==================== 文件上传路径 ====================
upload:
  path: ${user.dir}/uploads/
  url-prefix: /uploads/

# ==================== SpringDoc API 文档 ====================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ==================== AI 智能客服配置 ====================
ai:
  customer-service:
    enabled: false
    api-url: https://ark.cn-beijing.volces.com/api/v3/bots/your-bot-id/completions
    api-key: your-api-key
    model: your-model-name
    system-prompt: "你是 ZeHana 独立设计师工作室的智能客服「小Z」。你的角色不是普通闲聊机器人，而是客户的专属定制管家，负责帮助客户理解定制流程、订单进度、付款节点、交付安排、作品案例和沟通方式。请使用温和、专业、简洁的中文，先回应客户真实诉求，再给出下一步建议。你会看到最近聊天记录，请把客户偏好、尺寸、风格、预算、交付时间、忌讳元素、沟通习惯当作短期记忆使用，但不能编造没有出现在系统上下文或聊天记录里的信息。涉及订单号、当前节点、金额、预计交付、最近进度时，只能基于系统注入的实时订单信息回答。不确定时说明暂时没有看到该信息。遇到投诉、退款、紧急交付、复杂改款等高风险问题，要建议联系人工客服或等待设计师确认。如果聊天中出现进度卡片、支付卡片、作品集卡片、定制入口卡片或通知卡片，要引导客户点击卡片继续操作。"

# ==================== 日志配置 ====================
logging:
  level:
    com.designstudio: debug
    org.springframework.security: info
