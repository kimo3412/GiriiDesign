<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>小粥的粉黑特调背景</title>
    <style>
        /* --- 核心代码开始 --- */
        :root {
            --bg-color: #0a0a0a; /* 极致的深黑 */
            --accent-pink: #ff2a6d; /* 激进的电竞粉 */
            --accent-purple: #7d2ae8; /* 辅助的神秘紫 */
            --particle-color: rgba(255, 42, 109, 0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止滚动条出现 */
            background-color: var(--bg-color);
            font-family: 'Segoe UI', sans-serif; /* 随便设个字体 */
        }

        /* 1. 背景容器：承载所有视觉元素 */
        .anime-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* 确保背景在最底层 */
            background: radial-gradient(circle at 50% 120%, #1a0b14, var(--bg-color) 80%);
        }

        /* 2. 动态光斑：营造二次元的“呼吸感” */
        .glow-blob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60vw;
            height: 60vw;
            background: conic-gradient(from 0deg, var(--accent-purple), var(--accent-pink), var(--accent-purple));
            border-radius: 50%;
            filter: blur(80px); /* 强力模糊，制造光晕 */
            opacity: 0.4;
            animation: spinAndPulse 10s linear infinite;
            transform: translate(-50%, -50%);
        }

        /* 3. 网格层：增加科技感/UI感 */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 42, 109, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 42, 109, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* 4. 上升粒子：模拟动漫里的能量碎片 */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -10px;
            background: var(--accent-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-pink);
            animation: floatUp linear infinite;
        }

        /* --- 动画定义 --- */
        
        /* 光斑旋转+呼吸 */
        @keyframes spinAndPulse {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.2); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); opacity: 0.3; }
        }

        /* 粒子上浮 */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }
        
        /* 为了演示效果，加一点文字内容 */
        .content-demo {
            position: relative;
            z-index: 1;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 2rem;
            text-shadow: 0 0 20px var(--accent-pink);
            flex-direction: column;
        }
        
        .content-demo h1 { margin: 0; }
        .content-demo p { font-size: 1rem; opacity: 0.8; font-weight: normal; margin-top: 10px;}

        /* --- 核心代码结束 --- */
    </style>
</head>
<body>

    <div class="anime-bg-container">
        <div class="glow-blob"></div>
        <div class="grid-overlay"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="content-demo">
        <h1>Code & Magic</h1>
        <p>Design by Xiao Zhou</p>
    </div>

    <script>
        // 简单的JS用来生成随机粒子，不用JS也可以用纯CSS写死几个div，但这样更随机更好看
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20; // 粒子数量

        for (let i = 0; i < particleCount; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            
            // 随机大小、位置、动画时长
            const size = Math.random() * 5 + 2 + 'px';
            const left = Math.random() * 100 + '%';
            const duration = Math.random() * 5 + 5 + 's'; // 5-10秒
            const delay = Math.random() * 5 + 's';

            p.style.width = size;
            p.style.height = size;
            p.style.left = left;
            p.style.animationDuration = duration;
            p.style.animationDelay = delay;

            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
